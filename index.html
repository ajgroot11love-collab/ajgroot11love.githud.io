<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>LiftRank</title>

<style>
:root{
  --bg:#08080d;
  --card:#15151e;
  --card2:#1d1d29;
  --card3:#242435;
  --border:#303044;
  --text:#f7f7fb;
  --muted:#9b9baa;
  --purple:#7657ff;
  --purple2:#9b7cff;
  --blue:#51b7ff;
  --primary:#2860e0;
  --secondary:#7894df;
  --green:#36d17a;
  --orange:#ffae3d;
  --danger:#ff5d6c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:105px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:25px 18px 100px;
}

h1,h2,h3,p{
  margin-top:0;
}

h1{
  font-size:42px;
  margin-bottom:5px;
  letter-spacing:-1.5px;
}

h2{
  font-size:30px;
  margin-bottom:8px;
}

h3{
  font-size:21px;
}

.brand{
  font-size:40px;
  font-weight:900;
  letter-spacing:-2px;
}

.brand span{
  color:var(--purple);
}

.subtitle{
  color:var(--muted);
  font-size:17px;
  margin-bottom:20px;
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:25px;
}

.icon-button{
  width:48px;
  height:48px;
  border-radius:15px;
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  font-size:23px;
}

.card{
  background:linear-gradient(145deg,#171721,#12121a);
  border:1px solid var(--border);
  border-radius:25px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.hero{
  padding:26px;
}

.rank-card{
  display:flex;
  gap:20px;
  align-items:center;
}

.rank-icon{
  width:105px;
  height:105px;
  border-radius:25px;
  background:#2b2342;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  flex-shrink:0;
}

.rank-name{
  font-size:34px;
  font-weight:900;
  color:#ffc33d;
}

.progress{
  height:13px;
  background:#292c37;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
}

.progress>div{
  height:100%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  border-radius:20px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.stat{
  background:#13131b;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
}

.stat-label{
  color:var(--muted);
  font-size:14px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.stat-value{
  font-size:35px;
  font-weight:900;
  margin:8px 0;
}

.orange{color:var(--orange)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.purple{color:var(--purple2)}

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.quick{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  min-height:140px;
  text-align:left;
  color:white;
}

.quick-icon{
  font-size:34px;
  margin-bottom:12px;
}

.quick-title{
  font-size:19px;
  font-weight:800;
}

.quick-sub{
  color:var(--muted);
  margin-top:5px;
}

.primary-button{
  width:100%;
  padding:17px 20px;
  border-radius:18px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#7454ff,#875eff);
  font-size:18px;
}

.secondary-button{
  padding:13px 17px;
  border-radius:16px;
  color:white;
  background:var(--card3);
  border:1px solid var(--border);
  font-weight:700;
}

.danger-button{
  background:#32171d;
  color:#ff7580;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 0 15px;
}

.section-title h2{
  margin:0;
}

.search{
  width:100%;
  background:#111119;
  border:1px solid var(--border);
  color:white;
  border-radius:18px;
  padding:17px 18px;
  outline:none;
  margin-bottom:15px;
}

.search:focus{
  border-color:var(--purple);
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:15px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  white-space:nowrap;
  padding:12px 17px;
  border-radius:30px;
  background:#20212b;
  color:#c9c9d4;
}

.filter.active{
  background:#3c286f;
  color:white;
  border:1px solid #7050ff;
}

.exercise-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  margin-bottom:12px;
  overflow:hidden;
  width:100%;
  text-align:left;
  color:white;
}

.exercise-main{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
}

.exercise-thumb{
  width:68px;
  height:68px;
  border-radius:17px;
  background:linear-gradient(145deg,#30303d,#171720);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  flex-shrink:0;
}

.exercise-info{
  flex:1;
}

.exercise-name{
  font-weight:800;
  font-size:18px;
  margin-bottom:5px;
}

.exercise-meta{
  color:var(--muted);
  font-size:14px;
}

.chevron{
  color:#77778a;
  font-size:24px;
}

.food-action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:18px;
}

.food-action{
  background:linear-gradient(145deg,#1e1e2a,#14141c);
  border:1px solid var(--border);
  border-radius:22px;
  padding:20px;
  color:white;
  text-align:left;
  min-height:145px;
}

.food-action-icon{
  font-size:34px;
  margin-bottom:14px;
}

.food-action-title{
  font-size:18px;
  font-weight:800;
}

.food-action-sub{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
  line-height:1.4;
}

.macro-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.macro{
  background:#13131b;
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
}

.macro strong{
  font-size:23px;
  display:block;
}

.macro span{
  color:var(--muted);
  font-size:12px;
}

.food-entry{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
}

.food-entry-main{
  flex:1;
}

.food-entry-name{
  font-weight:800;
  font-size:17px;
}

.food-entry-info{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.food-entry-buttons{
  display:flex;
  gap:7px;
}

.small-button{
  padding:9px 11px;
  border-radius:11px;
  background:#292938;
  color:white;
  font-size:13px;
}

.recipe-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px;
  margin-bottom:11px;
}

.recipe-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.recipe-name{
  font-size:18px;
  font-weight:800;
}

.recipe-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.detail-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.detail-header h1{
  font-size:29px;
  flex:1;
  margin:0;
}

.exercise-art{
  height:235px;
  border-radius:22px;
  background:linear-gradient(145deg,#e9e9ed,#cfd0d5);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:16px;
}

.exercise-art svg{
  width:94%;
  height:94%;
}

.detail-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tag{
  padding:8px 12px;
  border-radius:12px;
  background:#282838;
  color:#ddd;
  font-size:13px;
}

.muscle-section{
  margin-top:25px;
}

.muscle-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.legend{
  display:flex;
  gap:12px;
  color:var(--muted);
  font-size:12px;
}

.legend span{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.dot.primary{background:var(--primary)}
.dot.secondary{background:var(--secondary)}

.muscle-map{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.body{
  width:100%;
  height:390px;
}

.body svg{
  width:100%;
  height:100%;
}

.body .none{
  fill:#dedfe8;
}

.body .primary{
  fill:#2860e0;
}

.body .secondary{
  fill:#7894df;
}

.body .outline{
  fill:#dedfe8;
  stroke:#c0c2cd;
  stroke-width:1.5;
}

.body .line{
  fill:none;
  stroke:#aeb1bd;
  stroke-width:1.3;
}

.muscle-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.muscle-pill{
  background:#191923;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
}

.muscle-pill strong{
  display:block;
  margin-bottom:5px;
}

.primary-text{
  color:#4f82ff;
}

.secondary-text{
  color:#91a6df;
}

.rank-list{
  display:grid;
  gap:12px;
}

.muscle-rank{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px;
}

.rank-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.rank-letter{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#4932a4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:20px;
}

.small-progress{
  height:9px;
  background:#292c37;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.small-progress div{
  height:100%;
  background:linear-gradient(90deg,#5d8cff,#8a63ff);
}

.workout-exercise{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:17px;
  margin-bottom:13px;
}

.workout-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.set-row{
  display:grid;
  grid-template-columns:45px 1fr 1fr 45px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.set-number{
  text-align:center;
  color:var(--muted);
}

.set-input{
  width:100%;
  background:#101017;
  border:1px solid var(--border);
  color:white;
  border-radius:11px;
  padding:10px;
  text-align:center;
  outline:none;
}

.remove-set{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#29171b;
  color:#ff6c78;
}

.routine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
  margin-bottom:12px;
}

.routine-info{
  flex:1;
}

.routine-name{
  font-weight:800;
  font-size:19px;
  margin-bottom:5px;
}

.routine-meta{
  color:var(--muted);
  font-size:14px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
  line-height:1.5;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-height:92vh;
  overflow:auto;
  background:#12121a;
  border-radius:30px 30px 0 0;
  border:1px solid var(--border);
  padding:22px;
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#252532;
  color:white;
  font-size:24px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  color:var(--muted);
  margin-bottom:7px;
}

.form-control{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#0f0f16;
  color:white;
  border:1px solid var(--border);
  outline:none;
}

.nutrition-preview{
  background:#191923;
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin:15px 0;
}

.camera-box{
  border:1px dashed #55556a;
  background:#15151f;
  border-radius:20px;
  padding:30px 20px;
  text-align:center;
  margin-bottom:15px;
}

.camera-icon{
  font-size:55px;
  margin-bottom:10px;
}

.barcode-box{
  background:#101017;
  border:1px solid var(--border);
  border-radius:20px;
  padding:20px;
  text-align:center;
  margin-bottom:15px;
}

.barcode-lines{
  height:75px;
  margin:15px auto;
  max-width:270px;
  background:repeating-linear-gradient(
    90deg,
    white 0px,
    white 3px,
    transparent 3px,
    transparent 7px
  );
  opacity:.9;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:calc(100% - 22px);
  max-width:850px;
  background:rgba(25,25,35,.96);
  border:1px solid #363647;
  border-radius:27px;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:90;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.nav-btn{
  background:transparent;
  color:#9696a7;
  border-radius:21px;
  padding:9px 4px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-btn.active{
  background:#242432;
  color:white;
}

.nav-icon{
  font-size:23px;
}

.nav-label{
  font-size:12px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%) translateY(20px);
  background:#f4f4f7;
  color:#111;
  padding:13px 18px;
  border-radius:15px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:560px){

  .app{
    padding-left:14px;
    padding-right:14px;
  }

  h1{
    font-size:35px;
  }

  .brand{
    font-size:35px;
  }

  .rank-card{
    gap:13px;
  }

  .rank-icon{
    width:78px;
    height:78px;
    font-size:40px;
  }

  .rank-name{
    font-size:28px;
  }

  .body{
    height:300px;
  }

  .exercise-art{
    height:195px;
  }

  .muscle-list{
    grid-template-columns:1fr;
  }

  .food-action-grid{
    gap:9px;
  }

  .food-action{
    padding:16px;
    min-height:130px;
  }

  .macro{
    padding:12px;
  }

  .macro strong{
    font-size:19px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<nav class="bottom-nav">

  <button class="nav-btn" data-tab="home">
    <span class="nav-icon">🏠</span>
    <span class="nav-label">Home</span>
  </button>

  <button class="nav-btn" data-tab="workout">
    <span class="nav-icon">🏋️</span>
    <span class="nav-label">Workout</span>
  </button>

  <button class="nav-btn" data-tab="exercises">
    <span class="nav-icon">📚</span>
    <span class="nav-label">Exercises</span>
  </button>

  <button class="nav-btn" data-tab="food">
    <span class="nav-icon">🍎</span>
    <span class="nav-label">Food</span>
  </button>

  <button class="nav-btn" data-tab="ranks">
    <span class="nav-icon">🏆</span>
    <span class="nav-label">Ranks</span>
  </button>

</nav>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal"></div>
</div>

<script>

/* =========================================================

========================================================= */

function save(){
  localStorage.setItem("liftrank_state",JSON.stringify(state));
}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(str){
  return String(str??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(message){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },1900);
}

function setTab(tab){
  state.tab=tab;
  currentExercise=null;
  save();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function xpLevel(){
  return Math.floor(state.xp/250)+1;
}

function xpProgress(){
  return ((state.xp%250)/250)*100;
}

function overallRank(){

  const level=xpLevel();

  if(level>=25)return["Diamond","💎"];
  if(level>=20)return["Platinum","🏆"];
  if(level>=15)return["Gold","🥇"];
  if(level>=10)return["Silver","🥈"];

  return["Bronze","🥉"];
}

function totalCalories(){
  return state.food.reduce((a,b)=>a+Number(b.calories||0),0);
}

function totalProtein(){
  return state.food.reduce((a,b)=>a+Number(b.protein||0),0);
}

function totalCarbs(){
  return state.food.reduce((a,b)=>a+Number(b.carbs||0),0);
}

function totalFat(){
  return state.food.reduce((a,b)=>a+Number(b.fat||0),0);
}

/* =========================================================
   FOOD DATABASE
========================================================= */

function addRecentFood(food){

  state.recentFoods=state.recentFoods.filter(
    x=>x.name.toLowerCase()!==food.name.toLowerCase()
  );

  state.recentFoods.unshift(food);

  state.recentFoods=state.recentFoods.slice(0,12);

  save();
}

function addFood(food){

  const normalized={
    name:food.name||"Food",
    calories:Number(food.calories)||0,
    protein:Number(food.protein)||0,
    carbs:Number(food.carbs)||0,
    fat:Number(food.fat)||0,
    serving:food.serving||"1 serving"
  };

  state.food.push(normalized);

  addRecentFood(normalized);

  save();

  showToast("Added to today's log");

  render();
}

function quickAddFood(index){

  const food=state.savedFoods[index];

  if(food)addFood(food);
}

function quickAddRecent(index){

  const food=state.recentFoods[index];

  if(food)addFood(food);
}

function deleteFood(index){

  state.food.splice(index,1);

  save();
  render();
}

function saveCurrentFood(index){

  const food=state.food[index];

  if(!food)return;

  const exists=state.savedFoods.some(
    x=>x.name.toLowerCase()===food.name.toLowerCase()
  );

  if(!exists){

    state.savedFoods.push({
      ...food
    });

    save();

    showToast("Saved to My Foods");

  }else{

    showToast("Already saved");

  }
}

async function detectBarcodeFromPhoto(event){

  const file=event.target.files[0];

  if(!file)return;

  if(!("BarcodeDetector" in window)){

    showToast("Photo scanner isn't supported here");

    setTimeout(()=>{
      openManualBarcode();
    },900);

    return;
  }

  try{

    const detector=new BarcodeDetector({
      formats:[
        "ean_13",
        "ean_8",
        "upc_a",
        "upc_e"
      ]
    });

    const image=await createImageBitmap(file);

    const codes=await detector.detect(image);

    if(!codes.length){

      showToast("No barcode found");

      return;
    }

    lookupBarcode(codes[0].rawValue);

  }catch(error){

    console.error(error);

    showToast("Couldn't scan barcode");

  }
}

async function lookupBarcode(code){

  const modal=document.getElementById("modal");

  modal.innerHTML=`

    <div class="modal-top">

      <h2>Looking Up Food</h2>

      <button class="close"
              onclick="closeModal()">
        ×
      </button>

    </div>

    <div class="empty">
      Searching the food database...
    </div>

  `;

  try{

    const url=
      "https://world.openfoodfacts.net/api/v2/product/"
      +encodeURIComponent(code)
      +"?fields=product_name,nutriments,serving_size";

    const response=await fetch(url);

    if(!response.ok){
      throw new Error("Network error");
    }

    const data=await response.json();

    if(!data.product || data.status!==1){

      modal.innerHTML=`

        <div class="modal-top">

          <h2>Food Not Found</h2>

          <button class="close"
                  onclick="closeModal()">
            ×
          </button>

        </div>

        <div class="empty">
          We couldn't find that barcode.
        </div>

        <button class="primary-button"
                onclick="openCreateFoodModal('${escapeHTML(code)}')">
          Create Food Manually
        </button>

      `;

      return;
    }

    const p=data.product;
    const n=p.nutriments||{};

    const food={

      name:p.product_name||"Scanned Food",

      calories:
        Math.round(
          Number(
            n["energy-kcal_serving"] ??
            n["energy-kcal_100g"] ??
            0
          )
        ),

      protein:

function searchFoodModal(){

  const input=document.getElementById("foodSearch");

  if(!input)return;

  const q=input.value.toLowerCase();

  const foods=[
    ...state.savedFoods,
    ...state.recentFoods
  ];

  const unique=[];

  foods.forEach(food=>{

    if(
      !unique.some(
        x=>x.name.toLowerCase()===food.name.toLowerCase()
      )
    ){

      unique.push(food);

    }

  });

  const results=q
    ?unique.filter(
      f=>f.name.toLowerCase().includes(q)
    )
    :unique.slice(0,10);

  const container=document.getElementById("foodSearchResults");

  if(!results.length){

    container.innerHTML=`
      <div class="empty">
        No saved food found.
      </div>
    `;

    return;
  }

  container.innerHTML=results.map((food,i)=>`

    <div class="food-entry">

      <div class="food-entry-main">

        <div class="food-entry-name">
          ${escapeHTML(food.name)}
        </div>

        <div class="food-entry-info">
          ${food.calories} cal •
          ${food.protein}g protein
        </div>

      </div>

      <button class="secondary-button"
              onclick="addFoodFromSearch(${i})">
        Add
      </button>

    </div>

  `).join("");

  window.currentFoodSearchResults=results;
}

function startEmptyWorkout(){

  state.workout=[];
  state.tab="workout";

  save();
  render();
}

function startRoutine(index){

  state.workout=ROUTINES[index].exercises.map(name=>({

    name,

    sets:[
      {weight:"",reps:""},
      {weight:"",reps:""}
    ]

  }));

  state.tab="workout";

  save();
  render();
}

function addExerciseToWorkout(index){

  const ex=EXERCISES[index];

  if(!state.workout.some(x=>x.name===ex.name)){

    state.workout.push({

      name:ex.name,

      sets:[
        {weight:"",reps:""}
      ]

    });

    showToast("Added to workout");

  }else{

    showToast("Already in workout");

  }

  state.tab="workout";
  currentExercise=null;

  save();
  render();
}

function removeWorkoutExercise(index){

  state.workout.splice(index,1);

  save();
  render();
}

function addSet(index){

  state.workout[index].sets.push({
    weight:"",
    reps:""
  });

  save();
  render();
}

function removeSet(index,setIndex){

  if(state.workout[index].sets.length<=1){

    showToast("Keep one set");

    return;
  }

  state.workout[index].sets.splice(setIndex,1);

  save();
  render();
}

function updateSet(index,setIndex,key,value){

  state.workout[index].sets[setIndex][key]=value;

  save();
}

function finishWorkout(){

  let completed=0;
  let volume=0;

  state.workout.forEach(item=>{

    const ex=EXERCISES.find(
      e=>e.name===item.name
    );

    item.sets.forEach(set=>{

      const weight=Number(set.weight)||0;
      const reps=Number(set.reps)||0;

      if(reps>0){

        completed++;

        volume+=weight*reps;

        state.history.push({

          exercise:item.name,
          weight,
          reps,
          date:new Date().toLocaleDateString()

        });

        if(ex){

          [...ex.primary,...ex.secondary]
            .forEach(m=>{

              state.muscleSets[m]=
                (state.muscleSets[m]||0)+1;

            });

        }

      }

    });

  });

  if(completed===0){

    showToast("Log at least one set");

    return;
  }

  state.completedSets+=completed;
  state.volume+=volume;
  state.xp+=completed*10;
  state.workouts++;
  state.workout=[];

  save();

  showToast("Workout complete! +"+completed*10+" XP");

  setTimeout(()=>{
    setTab("home");
  },600);
}

/* =========================================================
   EXERCISE DETAIL
========================================================= */

function openExercise(index){

  currentExercise=EXERCISES[index];

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function renderExerciseDetail(ex){

  return`

  <div class="detail-header">

    <button class="icon-button"
            onclick="currentExercise=null;render()">
      ‹
    </button>

    <h1>
      ${escapeHTML(ex.name)}
    </h1>

  </div>

  <div class="exercise-art">

    <div style="font-size:80px">
      ${ex.icon}
    </div>

  </div>

  <div class="detail-tags">

    <span class="tag">
      ${escapeHTML(ex.cat)}
    </span>

    <span class="tag">
      ${escapeHTML(ex.type)}
    </span>

  </div>

  <button
    class="primary-button"
    onclick="addExerciseToWorkout(${EXERCISES.indexOf(ex)})">

    + Add to Workout

  </button>

  <div class="card muscle-section">

    <div class="muscle-title">

      <h3>
        Muscles Worked
      </h3>

      <div class="legend">

        <span>
          <i class="dot primary"></i>
          Primary
        </span>

        <span>
          <i class="dot secondary"></i>
          Secondary
        </span>

      </div>

    </div>

    <div class="muscle-list">

      ${ex.primary.map(m=>`

        <div class="muscle-pill">

          <strong>
            ${m}
          </strong>

          <span class="primary-text">
            Primary
          </span>

        </div>

      `).join("")}

      ${ex.secondary.map(m=>`

        <div class="muscle-pill">

          <strong>
            ${m}
          </strong>

          <span class="secondary-text">
            Secondary
          </span>

        </div>

      `).join("")}

    </div>

  </div>

  <div class="card">

    <h3>
      How to Use
    </h3>

    <p style="color:var(--muted);line-height:1.6">
      Use controlled repetitions and choose a weight that
      allows you to maintain good technique.
    </p>

    <button
      class="secondary-button"
      style="width:100%"
      onclick="showToast('Video links will be connected here')">

      ▶ Watch How-To Video

    </button>

  </div>

  `;
}

/* =========================================================
   RANKS
========================================================= */

function renderRanks(){

  const[rank,icon]=overallRank();

  return`

  <div class="top-row">

    <div>

      <div class="brand">
        Lift<span>Rank</span>
      </div>

      <div class="subtitle">
        Your muscle progression.
      </div>

    </div>

  </div>

  <div class="card rank-card">

    <div class="rank-icon">
      ${icon}
    </div>

    <div>

      <div class="stat-label">
        Overall Rank
      </div>

      <div class="rank-name">
        ${rank}
      </div>

      <div style="color:var(--muted)">
        Level ${xpLevel()} • ${state.xp} XP
      </div>

    </div>

  </div>

  <div class="section-title">
    <h2>Muscle Ranks</h2>
  </div>

  <div class="rank-list">

    ${MUSCLES.map(m=>{

      const sets=state.muscleSets[m]||0;

      let letter="E";

      if(sets>=100)letter="S";
      else if(sets>=75)letter="A";
      else if(sets>=50)letter="B";
      else if(sets>=25)letter="C";
      else if(sets>=10)letter="D";

      const pct=Math.min(sets,100);

      return`

      <div class="muscle-rank">

        <div class="rank-row">

          <div>

            <strong style="font-size:19px">
              ${m}
            </strong>

            <div style="color:var(--muted);font-size:13px">
              ${sets} completed sets
            </div>

          </div>

          <div class="rank-letter">
            ${letter}
          </div>

        </div>

        <div class="small-progress">

          <div style="width:${pct}%"></div>

        </div>

      </div>

      `;

    }).join("")}

  </div>

  `;
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  let html="";

  if(currentExercise){

    html=renderExerciseDetail(currentExercise);

  }else{

    switch(state.tab){

      case"workout":
        html=renderWorkout();
        break;

      case"exercises":
        html=renderExercises();
        break;

      case"food":
        html=renderFood();
        break;

      case"ranks":
        html=renderRanks();
        break;

      default:
        html=renderHome();

    }

  }

  document.getElementById("app").innerHTML=`

    <main class="app">
      ${html}
    </main>

  `;

  document.querySelectorAll(".nav-btn")
    .forEach(btn=>{

      btn.classList.toggle(
        "active",
        !currentExercise &&
        btn.dataset.tab===state.tab
      );

    });
}

/* =========================================================
   MODAL
========================================================= */

function closeModal(){

  document
    .getElementById("modalBackdrop")
    .classList.remove("show");

}

document
  .getElementById("modalBackdrop")
  .addEventListener("click",e=>{

    if(e.target.id==="modalBackdrop"){
      closeModal();
    }

  });

/* =========================================================
   NAV
========================================================= */

document.querySelectorAll(".nav-btn")
  .forEach(btn=>{

    btn.addEventListener("click",()=>{

      setTab(btn.dataset.tab);

    });

  });

/* =========================================================
   START
========================================================= */

render();

</script>

</body>
</html>
