<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c12">
<title>LiftRank</title>
<style>
:root{
  --bg:#090a0f;--card:#151821;--card2:#1b1e28;--line:#292e3a;
  --text:#f5f6fb;--muted:#9299aa;--purple:#7c5cff;--purple2:#9b7cff;
  --green:#35d07f;--orange:#ffad45;--blue:#4da3ff;--red:#ff6574;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
body{min-height:100vh;padding-bottom:96px}
button,input,select{font:inherit}
button{border:0;color:inherit}
.app{max-width:900px;margin:auto;padding:20px 18px 30px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.logo{font-size:30px;font-weight:900;letter-spacing:-1.5px}.logo span{color:var(--purple)}
.date{color:var(--muted);font-size:14px}
h1{font-size:38px;line-height:1.05;margin:10px 0 6px;letter-spacing:-1.7px}
h2{font-size:23px;margin:28px 0 14px}
h3{margin:0 0 8px}
.sub{color:var(--muted);font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin:12px 0}
.rank{background:linear-gradient(145deg,#18152b,#171824);border-color:#493b79}
.rankrow{display:flex;justify-content:space-between;align-items:center}
.rankname{font-size:30px;font-weight:800}.badge{width:68px;height:68px;border-radius:50%;background:var(--purple);display:grid;place-items:center;font-size:25px;font-weight:900}
.progress{height:9px;background:#2b2f39;border-radius:99px;overflow:hidden;margin:18px 0 7px}.progress i{display:block;height:100%;background:var(--purple);border-radius:99px}
.smallrow{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{min-height:130px}.stat .label{color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.5px}.stat .num{font-size:34px;font-weight:850;margin:10px 0 3px}.orange{color:var(--orange)}.green{color:var(--green)}.blue{color:var(--blue)}.purple{color:var(--purple)}
.btn{background:var(--purple);padding:13px 17px;border-radius:15px;font-weight:800;cursor:pointer}.btn.secondary{background:#252a35}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.green{background:var(--green);color:#07130d}.btn.danger{background:#392028;color:#ff8490}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.search{width:100%;background:#11141c;border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:15px;outline:none}
.exercise-list,.routine-list{display:grid;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#11141b;border:1px solid var(--line);padding:14px;border-radius:17px}
.item strong{display:block}.meta{color:var(--muted);font-size:13px;margin-top:4px}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.chip{white-space:nowrap;padding:9px 12px;border-radius:999px;background:#20242e;color:#c6cbd7}.chip.active{background:#32285a;color:#fff}
.hidden{display:none!important}
.nav{position:fixed;z-index:50;bottom:12px;left:50%;transform:translateX(-50%);width:min(94%,850px);background:#1b1f29eF;backdrop-filter:blur(20px);border:1px solid #363c49;border-radius:26px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);box-shadow:0 10px 40px #0008}
.nav button{background:transparent;padding:10px 4px;border-radius:18px;color:var(--muted);font-size:12px}.nav button.active{background:#202531;color:#fff}.nav .ico{display:block;font-size:23px;margin-bottom:2px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.exercise-card{padding:15px;background:#10131a;border:1px solid var(--line);border-radius:19px;margin:10px 0}
.exercise-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.setrow{display:grid;grid-template-columns:35px 1fr 1fr 48px 42px;gap:7px;align-items:center;margin:7px 0}
.setrow input{width:100%;min-width:0;background:#1b1f28;border:1px solid #303643;color:#fff;border-radius:10px;padding:9px;text-align:center}
.setnum{color:var(--muted);text-align:center}.check{background:#252a34;border-radius:10px;height:39px}.check.done{background:var(--green);color:#07130d}
.timer{font-size:46px;font-variant-numeric:tabular-nums;font-weight:850;text-align:center;margin:8px 0}
.timerbox{text-align:center;background:#11141b;border:1px solid var(--line);border-radius:20px;padding:15px}
.mini{font-size:12px;color:var(--muted)}
.recipe{background:#11141b;border:1px solid var(--line);border-radius:18px;padding:15px}.recipe p{color:var(--muted);margin:5px 0 12px}
.recipe ul,.recipe ol{color:#c9ced8;padding-left:20px}.recipe li{margin:6px 0}
.barrow{margin:12px 0}.barlabel{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}.bar{height:12px;background:#292e38;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);border-radius:99px}
.muscle-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muscle{background:#11141b;border:1px solid var(--line);border-radius:16px;padding:13px}
.empty{color:var(--muted);text-align:center;padding:25px}
.modal{position:fixed;inset:0;background:#05060aeF;z-index:100;overflow:auto;padding:18px}
.modalinner{max-width:760px;margin:auto;padding-bottom:40px}.modalhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#090a0fEE;padding:8px 0 14px;backdrop-filter:blur(12px);z-index:2}
.close{width:42px;height:42px;border-radius:50%;background:#252a34;font-size:22px}
.toast{position:fixed;z-index:200;left:50%;bottom:105px;transform:translateX(-50%);background:#f4f5f8;color:#101116;padding:12px 16px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px #0008}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}
input,select{background:#11141b;border:1px solid var(--line);color:#fff;border-radius:12px;padding:12px;width:100%}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){h1{font-size:34px}.setrow{grid-template-columns:27px 1fr 1fr 43px 38px}.setrow input{padding:8px 4px}.app{padding-left:14px;padding-right:14px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"></div>
<div id="toast" class="toast hidden"></div>

<nav class="nav">
  <button data-tab="home" onclick="showTab('home')"><span class="ico">🏠</span>Home</button>
  <button data-tab="workout" onclick="showTab('workout')"><span class="ico">🏋️</span>Workout</button>
  <button data-tab="food" onclick="showTab('food')"><span class="ico">🍎</span>Food</button>
  <button data-tab="progress" onclick="showTab('progress')"><span class="ico">📈</span>Progress</button>
</nav>

<script>
const KEY="liftrank_v3";
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const defaultExercises=[
 ["Bench Press","Chest","Barbell"],["Incline Dumbbell Press","Chest","Dumbbell"],["Chest Fly","Chest","Machine"],
 ["Lat Pulldown","Back","Machine"],["Seated Row","Back","Machine"],["One-Arm Dumbbell Row","Back","Dumbbell"],
 ["Shoulder Press","Shoulders","Machine"],["Lateral Raise","Shoulders","Dumbbell"],["Rear Delt Fly","Shoulders","Machine"],
 ["Bicep Curl","Biceps","Dumbbell"],["Hammer Curl","Biceps","Dumbbell"],["Tricep Pushdown","Triceps","Cable"],
 ["Overhead Tricep Extension","Triceps","Cable"],["Leg Press","Quads","Machine"],["Leg Extension","Quads","Machine"],
 ["Leg Curl","Hamstrings","Machine"],["Romanian Deadlift","Hamstrings","Barbell"],["Hip Thrust","Glutes","Barbell"],
 ["Calf Raise","Calves","Machine"],["Plank","Core","Bodyweight"]
].map(([name,muscle,equipment])=>({id:uid(),name,muscle,equipment}));

const defaultRoutines=[
 {id:uid(),name:"Push Day",desc:"Chest • Shoulders • Triceps",ex:["Bench Press","Incline Dumbbell Press","Shoulder Press","Lateral Raise","Tricep Pushdown"]},
 {id:uid(),name:"Pull Day",desc:"Back • Biceps",ex:["Lat Pulldown","Seated Row","Rear Delt Fly","Bicep Curl","Hammer Curl"]},
 {id:uid(),name:"Leg Day",desc:"Quads • Hamstrings • Glutes • Calves",ex:["Leg Press","Leg Extension","Leg Curl","Hip Thrust","Calf Raise"]},
 {id:uid(),name:"Full Body",desc:"A little of everything",ex:["Leg Press","Bench Press","Lat Pulldown","Shoulder Press","Bicep Curl","Tricep Pushdown"]}
];

let db=JSON.parse(localStorage.getItem(KEY)||"null")||{
 xp:0, workouts:[], food:[], routines:defaultRoutines, exercises:defaultExercises
};
if(!db.exercises?.length) db.exercises=defaultExercises;
if(!db.routines?.length) db.routines=defaultRoutines;
let activeTab="home", activeWorkout=null, timerInt=null, timerSec=0;

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function rank(){
 const x=db.xp;
 if(x>=5000)return["Diamond","D",5000];
 if(x>=2500)return["Platinum","P",2500];
 if(x>=1200)return["Gold","G",1200];
 if(x>=600)return["Silver","S",600];
 if(x>=250)return["Bronze+","B+",250];
 return["Bronze","B",0];
}
function xpToNext(){const x=db.xp; if(x<250)return 250; if(x<600)return 600;if(x<1200)return 1200;if(x<2500)return 2500;if(x<5000)return 5000;return 5000}
function volume(){return db.workouts.reduce((a,w)=>a+(w.exercises||[]).reduce((b,e)=>b+(e.sets||[]).reduce((c,s)=>c+(+s.weight||0)*(+s.reps||0),0),0),0)}
function todayFood(){return db.food.filter(x=>x.date===today()).reduce((a,x)=>({cal:a.cal+(+x.cal||0),protein:a.protein+(+x.protein||0)}),{cal:0,protein:0})}
function musclesForRange(days){
 const cutoff=new Date();cutoff.setDate(cutoff.getDate()-days+1);
 const counts={};
 db.workouts.filter(w=>new Date(w.date)>=cutoff).forEach(w=>(w.exercises||[]).forEach(e=>{
   const ex=db.exercises.find(x=>x.name===e.name); if(ex) counts[ex.muscle]=(counts[ex.muscle]||0)+(e.sets||[]).filter(s=>s.done).length;
 }));
 return counts;
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),1800)}
function showTab(tab){activeTab=tab;render()}
function render(){
 const r=rank(),food=todayFood(),next=xpToNext(),pct=Math.min(100,Math.round((db.xp/(next||1))*100));
 document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===activeTab));
 let html="";
 if(activeTab==="home") html=homeHTML(r,food,next,pct);
 if(activeTab==="workout") html=workoutHTML();
 if(activeTab==="food") html=foodHTML(food);
 if(activeTab==="progress") html=progressHTML();
 document.getElementById("app").innerHTML=`<main class="app">${html}</main>`;
}
function homeHTML(r,food,next,pct){
 return `<div class="top"><div class="logo">Lift<span>Rank</span></div><div class="date">${new Date().toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})}</div></div>
 <h1>Welcome back 👋</h1><div class="sub">Let's make today count.</div>
 <div class="card rank"><div class="rankrow"><div><div class="mini">CURRENT RANK</div><div class="rankname">${r[0]}</div><div class="sub">${db.xp} XP</div></div><div class="badge">${r[1]}</div></div>
 <div class="progress"><i style="width:${pct}%"></i></div><div class="smallrow"><span>${db.xp} XP</span><span>${next} XP</span></div></div>
 <div class="grid">
  <div class="card stat"><div class="label">Calories</div><div class="num orange">${food.cal}</div><div class="sub">eaten today</div></div>
  <div class="card stat"><div class="label">Protein</div><div class="num green">${Math.round(food.protein)}g</div><div class="sub">today</div></div>
  <div class="card stat"><div class="label">Workouts</div><div class="num purple">${db.workouts.length}</div><div class="sub">total</div></div>
  <div class="card stat"><div class="label">Volume</div><div class="num blue">${Math.round(volume()).toLocaleString()}</div><div class="sub">lbs lifted</div></div>
 </div>
 <h2>Quick Start</h2><div class="routine-list">${db.routines.slice(0,4).map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.desc)}</div></div><button class="btn" onclick="startRoutine('${x.id}')">Start</button></div>`).join("")}</div>`;
}
function workoutHTML(){
 return `<div class="top"><div><div class="logo">Lift<span>Rank</span></div><div class="sub">Build your workout.</div></div><button class="btn" onclick="newWorkout()">＋ Start Empty</button></div>
 <div class="chips"><button class="chip active">All</button><button class="chip">Chest</button><button class="chip">Back</button><button class="chip">Legs</button><button class="chip">Shoulders</button></div>
 <input id="exerciseSearch" class="search" placeholder="Search exercises..." oninput="filterExercises(this.value)">
 <h2>Routines</h2><div class="routine-list">${db.routines.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.desc)} • ${x.ex.length} exercises</div></div><div class="btnrow"><button class="btn secondary" onclick="startRoutine('${x.id}')">Fast Start</button></div></div>`).join("")}</div>
 <h2>Exercises</h2><div id="exerciseList" class="exercise-list">${exerciseItems(db.exercises)}</div>`;
}
function exerciseItems(list){
 return list.map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${esc(x.muscle)} • ${esc(x.equipment)}</div></div><button class="btn secondary" onclick="addExerciseToNew('${x.name.replace(/'/g,"\\'")}')">Add</button></div>`).join("")||`<div class="empty">No exercises found.</div>`;
}
function filterExercises(q){const list=db.exercises.filter(x=>(x.name+" "+x.muscle+" "+x.equipment).toLowerCase().includes(q.toLowerCase()));document.getElementById("exerciseList").innerHTML=exerciseItems(list)}
function foodHTML(food){
 return `<div class="top"><div><div class="logo">Lift<span>Rank</span></div><div class="sub">Fuel your training.</div></div><button class="btn" onclick="openFoodForm()">＋ Log Food</button></div>
 <div class="grid"><div class="card stat"><div class="label">Calories</div><div class="num orange">${food.cal}</div><div class="sub">today</div></div><div class="card stat"><div class="label">Protein</div><div class="num green">${Math.round(food.protein)}g</div><div class="sub">today</div></div></div>
 <h2>Recipes</h2><div class="routine-list">
 ${recipe("High-Protein Chicken Bowl","~520 cal • 48g protein",["5 oz cooked chicken","1 cup cooked rice","1 cup vegetables","2 tbsp Greek yogurt sauce"],["Cook or reheat chicken and rice.","Add vegetables and top with Greek yogurt sauce."])}
 ${recipe("Protein Oatmeal","~390 cal • 30g protein",["1/2 cup oats","1 cup milk","1 scoop protein powder","1/2 banana"],["Cook oats with milk.","Stir in protein powder after cooking and add banana."])}
 ${recipe("Greek Yogurt Berry Bowl","~300 cal • 25g protein",["1 cup Greek yogurt","1 cup berries","1 tbsp peanut butter","1 tbsp granola"],["Combine yogurt and berries.","Top with peanut butter and granola."])}
 </div>
 <h2>Today's Food</h2><div class="routine-list">${db.food.filter(x=>x.date===today()).map((x,i)=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="meta">${x.cal} cal • ${x.protein}g protein</div></div><button class="btn danger" onclick="deleteFood(${i})">Delete</button></div>`).join("")||`<div class="empty">Nothing logged yet.</div>`}</div>`;
}
function recipe(name,meta,ingredients,steps){
 return `<div class="recipe"><h3>${esc(name)}</h3><p>${esc(meta)}</p><strong>Ingredients</strong><ul>${ingredients.map(x=>`<li>${esc(x)}</li>`).join("")}</ul><strong>Steps</strong><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><button class="btn secondary" onclick="openFoodForm('${name.replace(/'/g,"\\'")}')">Log this recipe</button></div>`;
}
function progressHTML(){
 const day=musclesForRange(1),week=musclesForRange(7),max=Math.max(1,...Object.values(week));
 const muscles=["Chest","Back","Shoulders","Biceps","Triceps","Quads","Hamstrings","Glutes","Calves","Core"];
 const bars=(data)=>muscles.map(m=>`<div class="barrow"><div class="barlabel"><span>${m}</span><span>${data[m]||0} sets</span></div><div class="bar"><i style="width:${Math.min(100,((data[m]||0)/max)*100)}%"></i></div></div>`).join("");
 return `<div class="top"><div><div class="logo">Lift<span>Rank</span></div><div class="sub">See what you've trained.</div></div></div>
 <div class="card"><div class="sectionhead"><div><h3>Muscles Today</h3><div class="meta">Completed sets by muscle</div></div></div>${bars(day)}</div>
 <div class="card"><div class="sectionhead"><div><h3>Muscles This Week</h3><div class="meta">Last 7 days</div></div></div>${bars(week)}</div>
 <div class="card"><h3>Muscle Map</h3><div class="muscle-grid">${muscles.map(m=>`<div class="muscle"><strong>${m}</strong><div class="meta">${week[m]||0} completed sets</div></div>`).join("")}</div></div>`;
}
function newWorkout(){openWorkout({name:"Quick Workout",exercises:[]})}
function startRoutine(id){const r=db.routines.find(x=>x.id===id);openWorkout({name:r.name,exercises:r.ex.map(n=>({name:n,sets:[makeSet(),makeSet(),makeSet()]}))})}
function addExerciseToNew(name){
 if(!activeWorkout){newWorkout();setTimeout(()=>addExerciseToNew(name),50);return}
 activeWorkout.exercises.push({name,sets:[makeSet(),makeSet(),makeSet()]});renderWorkoutModal();toast("Exercise added")
}
function makeSet(){return {weight:"",reps:"",done:false}}
function openWorkout(w){activeWorkout={...w,start:Date.now()};timerSec=0;clearInterval(timerInt);timerInt=setInterval(()=>{timerSec++;const el=document.getElementById("elapsed");if(el)el.textContent=formatTime(timerSec)},1000);renderWorkoutModal()}
function renderWorkoutModal(){
 const m=document.getElementById("modal");m.classList.remove("hidden");
 m.innerHTML=`<div class="modalinner"><div class="modalhead"><div><strong>${esc(activeWorkout.name)}</strong><div class="mini">Workout in progress</div></div><button class="close" onclick="confirmCloseWorkout()">×</button></div>
 <div class="timerbox"><div class="mini">ELAPSED</div><div id="elapsed" class="timer">${formatTime(timerSec)}</div><div class="btnrow" style="justify-content:center"><button class="btn secondary" onclick="startRest()">Rest Timer</button></div></div>
 <div id="activeExercises">${activeWorkout.exercises.map((e,ei)=>exerciseEditor(e,ei)).join("")}</div>
 <div class="btnrow"><button class="btn secondary" onclick="chooseExercise()">＋ Add Exercise</button><button class="btn green" onclick="finishWorkout()">Finish Workout</button></div></div>`;
}
function exerciseEditor(e,ei){
 return `<div class="exercise-card"><div class="exercise-head"><div><strong>${esc(e.name)}</strong><div class="meta">${esc(db.exercises.find(x=>x.name===e.name)?.muscle||"")}</div></div><button class="btn danger" onclick="removeExercise(${ei})">Remove</button></div>
 <div class="setrow mini"><span>SET</span><span>WEIGHT (LB)</span><span>REPS</span><span></span><span></span></div>
 ${e.sets.map((s,si)=>`<div class="setrow"><span class="setnum">${si+1}</span><input inputmode="decimal" value="${s.weight}" placeholder="0" onchange="setVal(${ei},${si},'weight',this.value)"><input inputmode="numeric" value="${s.reps}" placeholder="0" onchange="setVal(${ei},${si},'reps',this.value)"><button class="check ${s.done?"done":""}" onclick="toggleSet(${ei},${si})">${s.done?"✓":"○"}</button><button class="check" onclick="removeSet(${ei},${si})">−</button></div>`).join("")}
 <button class="btn secondary" onclick="addSet(${ei})">＋ Add Set</button></div>`;
}
function setVal(e,s,k,v){activeWorkout.exercises[e].sets[s][k]=v}
function addSet(e){activeWorkout.exercises[e].sets.push(makeSet());renderWorkoutModal()}
function removeSet(e,s){if(activeWorkout.exercises[e].sets.length>1)activeWorkout.exercises[e].sets.splice(s,1);renderWorkoutModal()}
function toggleSet(e,s){const set=activeWorkout.exercises[e].sets[s];set.done=!set.done;if(set.done)toast("Set completed ✓");renderWorkoutModal()}
function removeExercise(e){activeWorkout.exercises.splice(e,1);renderWorkoutModal()}
function chooseExercise(){
 const choices=db.exercises.map((x,i)=>`<button class="item" style="width:100%;text-align:left" onclick="addToActive('${x.name.replace(/'/g,"\\'")}')"><span><strong>${esc(x.name)}</strong><span class="meta">${esc(x.muscle)}</span></span><span>＋</span></button>`).join("");
 document.getElementById("modal").innerHTML=`<div class="modalinner"><div class="modalhead"><strong>Add Exercise</strong><button class="close" onclick="renderWorkoutModal()">×</button></div><div class="exercise-list">${choices}</div></div>`;
}
function addToActive(name){activeWorkout.exercises.push({name,sets:[makeSet(),makeSet(),makeSet()]});renderWorkoutModal()}
function finishWorkout(){
 if(!activeWorkout.exercises.length){toast("Add at least one exercise");return}
 const completed=activeWorkout.exercises.reduce((a,e)=>a+e.sets.filter(s=>s.done).length,0);
 const vol=activeWorkout.exercises.reduce((a,e)=>a+e.sets.reduce((b,s)=>b+(+s.weight||0)*(+s.reps||0),0),0);
 const xp=Math.max(25,completed*10+Math.round(vol/100));
 db.workouts.push({id:uid(),date:today(),name:activeWorkout.name,exercises:activeWorkout.exercises,duration:timerSec,volume:vol,xp});
 db.xp+=xp;save();clearInterval(timerInt);activeWorkout=null;document.getElementById("modal").classList.add("hidden");toast(`Workout saved • +${xp} XP`);render()
}
function confirmCloseWorkout(){if(confirm("Leave this workout? Your unsaved sets will be lost.")){clearInterval(timerInt);activeWorkout=null;document.getElementById("modal").classList.add("hidden")}}
function startRest(){let s=60;const old=document.getElementById("toast");old.classList.remove("hidden");const tick=setInterval(()=>{old.textContent=`Rest: ${s}s`;s--;if(s<0){clearInterval(tick);old.textContent="Rest finished ✓";setTimeout(()=>old.classList.add("hidden"),1200)}},1000)}
function formatTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function openFoodForm(prefill=""){
 const m=document.getElementById("modal");m.classList.remove("hidden");m.innerHTML=`<div class="modalinner"><div class="modalhead"><strong>Log Food</strong><button class="close" onclick="mClose()">×</button></div>
 <div class="card"><label>Food / recipe name</label><input id="fn" value="${esc(prefill)}" placeholder="Chicken bowl"><div class="formgrid"><div><label>Calories</label><input id="fc" inputmode="numeric" placeholder="500"></div><div><label>Protein (g)</label><input id="fp" inputmode="decimal" placeholder="40"></div></div><br><button class="btn" onclick="saveFood()">Add Food</button></div></div>`;
}
function mClose(){document.getElementById("modal").classList.add("hidden")}
function saveFood(){const name=document.getElementById("fn").value.trim()||"Food";const cal=+document.getElementById("fc").value||0;const protein=+document.getElementById("fp").value||0;db.food.push({id:uid(),date:today(),name,cal,protein});save();mClose();toast("Food logged");render()}
function deleteFood(index){const items=db.food.filter(x=>x.date===today());const target=items[index];db.food=db.food.filter(x=>x!==target);save();render()}
render();
</script>
</body>
</html>
