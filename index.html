<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LiftRank</title>

<style>
:root{
  --bg:#08080d;
  --card:#15151e;
  --card2:#1d1d29;
  --card3:#242435;
  --border:#303044;
  --text:#f7f7fb;
  --muted:#9b9baa;
  --purple:#7657ff;
  --purple2:#9b7cff;
  --blue:#51b7ff;
  --primary:#2860e0;
  --secondary:#7894df;
  --green:#36d17a;
  --orange:#ffae3d;
  --danger:#ff5d6c;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:105px;
}

button,
input,
select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:25px 18px 100px;
}

h1,h2,h3,p{
  margin-top:0;
}

h1{
  font-size:42px;
  margin-bottom:5px;
  letter-spacing:-1.5px;
}

h2{
  font-size:30px;
  margin-bottom:8px;
}

h3{
  font-size:21px;
}

.subtitle{
  color:var(--muted);
  font-size:18px;
  margin-bottom:25px;
}

.brand{
  font-size:40px;
  font-weight:900;
  letter-spacing:-2px;
}

.brand span{
  color:var(--purple);
}

.top-row{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  margin-bottom:25px;
}

.icon-button{
  width:48px;
  height:48px;
  border-radius:15px;
  background:var(--card2);
  color:white;
  border:1px solid var(--border);
  font-size:23px;
}

.card{
  background:linear-gradient(145deg,#171721,#12121a);
  border:1px solid var(--border);
  border-radius:25px;
  padding:22px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

.hero{
  padding:26px;
}

.rank-card{
  display:flex;
  gap:20px;
  align-items:center;
}

.rank-icon{
  width:105px;
  height:105px;
  border-radius:25px;
  background:#2b2342;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:52px;
  flex-shrink:0;
}

.rank-name{
  font-size:34px;
  font-weight:900;
  color:#ffc33d;
}

.progress{
  height:13px;
  background:#292c37;
  border-radius:20px;
  overflow:hidden;
  margin-top:15px;
}

.progress > div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--blue),var(--purple));
  border-radius:20px;
  transition:.3s;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.stat{
  background:#13131b;
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
}

.stat-label{
  color:var(--muted);
  font-size:15px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.stat-value{
  font-size:38px;
  font-weight:900;
  margin:8px 0;
}

.orange{color:var(--orange)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.purple{color:var(--purple2)}

.quick-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.quick{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:22px;
  padding:22px;
  min-height:145px;
  text-align:left;
  color:white;
}

.quick-icon{
  font-size:35px;
  margin-bottom:15px;
}

.quick-title{
  font-size:21px;
  font-weight:800;
}

.quick-sub{
  color:var(--muted);
  margin-top:6px;
}

.primary-button{
  width:100%;
  padding:17px 20px;
  border-radius:18px;
  color:white;
  font-weight:800;
  background:linear-gradient(135deg,#7454ff,#875eff);
  font-size:18px;
}

.secondary-button{
  padding:14px 18px;
  border-radius:16px;
  color:white;
  background:var(--card3);
  border:1px solid var(--border);
  font-weight:700;
}

.danger-button{
  background:#32171d;
  color:#ff7580;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:30px 0 15px;
}

.section-title h2{
  margin:0;
}

.search{
  width:100%;
  background:#111119;
  border:1px solid var(--border);
  color:white;
  border-radius:18px;
  padding:17px 18px;
  outline:none;
  margin-bottom:15px;
}

.search:focus{
  border-color:var(--purple);
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:8px;
  margin-bottom:15px;
  scrollbar-width:none;
}

.filters::-webkit-scrollbar{
  display:none;
}

.filter{
  white-space:nowrap;
  padding:12px 17px;
  border-radius:30px;
  background:#20212b;
  color:#c9c9d4;
  border:1px solid transparent;
}

.filter.active{
  background:#3c286f;
  color:white;
  border-color:#7050ff;
}

.exercise-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  margin-bottom:12px;
  overflow:hidden;
}

.exercise-main{
  display:flex;
  align-items:center;
  gap:15px;
  padding:16px;
}

.exercise-thumb{
  width:68px;
  height:68px;
  border-radius:17px;
  background:linear-gradient(145deg,#30303d,#171720);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  flex-shrink:0;
}

.exercise-info{
  flex:1;
}

.exercise-name{
  font-weight:800;
  font-size:18px;
  margin-bottom:5px;
}

.exercise-meta{
  color:var(--muted);
  font-size:14px;
}

.chevron{
  color:#77778a;
  font-size:24px;
}

.detail-header{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:20px;
}

.detail-header h1{
  font-size:29px;
  flex:1;
  margin:0;
}

.exercise-art{
  height:235px;
  border-radius:22px;
  background:linear-gradient(145deg,#e9e9ed,#cfd0d5);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:16px;
}

.exercise-art svg{
  width:94%;
  height:94%;
}

.detail-tags{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tag{
  padding:8px 12px;
  border-radius:12px;
  background:#282838;
  color:#ddd;
  font-size:13px;
}

.muscle-section{
  margin-top:25px;
}

.muscle-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.legend{
  display:flex;
  gap:12px;
  color:var(--muted);
  font-size:12px;
}

.legend span{
  display:flex;
  align-items:center;
  gap:5px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
}

.dot.primary{
  background:var(--primary);
}

.dot.secondary{
  background:var(--secondary);
}

.muscle-map{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.body{
  width:100%;
  height:390px;
}

.body svg{
  width:100%;
  height:100%;
}

.body .none{
  fill:#dedfe8;
}

.body .primary{
  fill:#2860e0;
  filter:drop-shadow(0 0 5px rgba(40,96,224,.35));
}

.body .secondary{
  fill:#7894df;
}

.body .outline{
  fill:#dedfe8;
  stroke:#c0c2cd;
  stroke-width:1.5;
}

.body .line{
  fill:none;
  stroke:#aeb1bd;
  stroke-width:1.3;
}

.muscle-list{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.muscle-pill{
  background:#191923;
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
}

.muscle-pill strong{
  display:block;
  margin-bottom:5px;
}

.primary-text{
  color:#4f82ff;
}

.secondary-text{
  color:#91a6df;
}

.rank-list{
  display:grid;
  gap:12px;
}

.muscle-rank{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px;
}

.rank-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.rank-letter{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#4932a4;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  font-size:20px;
}

.small-progress{
  height:9px;
  background:#292c37;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
}

.small-progress div{
  height:100%;
  background:linear-gradient(90deg,#5d8cff,#8a63ff);
}

.workout-exercise{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:17px;
  margin-bottom:13px;
}

.workout-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.set-row{
  display:grid;
  grid-template-columns:45px 1fr 1fr 45px;
  gap:8px;
  align-items:center;
  margin-bottom:8px;
}

.set-number{
  text-align:center;
  color:var(--muted);
}

.set-input{
  width:100%;
  background:#101017;
  border:1px solid var(--border);
  color:white;
  border-radius:11px;
  padding:10px;
  text-align:center;
  outline:none;
}

.remove-set{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#29171b;
  color:#ff6c78;
}

.routine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:18px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
  margin-bottom:12px;
}

.routine-info{
  flex:1;
}

.routine-name{
  font-weight:800;
  font-size:19px;
  margin-bottom:5px;
}

.routine-meta{
  color:var(--muted);
  font-size:14px;
}

.food-entry{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px 15px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:100;
  display:none;
  align-items:flex-end;
}

.modal-backdrop.show{
  display:flex;
}

.modal{
  width:100%;
  max-height:92vh;
  overflow:auto;
  background:#12121a;
  border-radius:30px 30px 0 0;
  border:1px solid var(--border);
  padding:22px;
  animation:slideUp .2s ease;
}

@keyframes slideUp{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.close{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#252532;
  color:white;
  font-size:24px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  color:var(--muted);
  margin-bottom:7px;
}

.form-control{
  width:100%;
  padding:14px;
  border-radius:14px;
  background:#0f0f16;
  color:white;
  border:1px solid var(--border);
  outline:none;
}

.bottom-nav{
  position:fixed;
  left:50%;
  bottom:10px;
  transform:translateX(-50%);
  width:calc(100% - 22px);
  max-width:850px;
  background:rgba(25,25,35,.96);
  border:1px solid #363647;
  border-radius:27px;
  padding:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:90;
  box-shadow:0 12px 40px rgba(0,0,0,.45);
  backdrop-filter:blur(18px);
}

.nav-btn{
  background:transparent;
  color:#9696a7;
  border-radius:21px;
  padding:9px 4px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-btn.active{
  background:#242432;
  color:white;
}

.nav-icon{
  font-size:23px;
  line-height:1;
}

.nav-label{
  font-size:12px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:105px;
  transform:translateX(-50%) translateY(20px);
  background:#f4f4f7;
  color:#111;
  padding:13px 18px;
  border-radius:15px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:560px){
  .app{
    padding-left:14px;
    padding-right:14px;
  }

  h1{
    font-size:35px;
  }

  .brand{
    font-size:35px;
  }

  .rank-card{
    gap:13px;
  }

  .rank-icon{
    width:78px;
    height:78px;
    font-size:40px;
  }

  .rank-name{
    font-size:28px;
  }

  .body{
    height:300px;
  }

  .exercise-art{
    height:195px;
  }

  .muscle-list{
    grid-template-columns:1fr;
  }

  .quick-grid{
    gap:10px;
  }

  .quick{
    padding:17px;
    min-height:125px;
  }

  .quick-title{
    font-size:18px;
  }
}
</style>
</head>

<nav class="bottom-nav">

  tab:"home",

  completedSets:0,
  workouts:0,

  food:[],

  muscleSets:{},
  history:[]
};

let exerciseFilter="All";
let exerciseSearch="";

/* =========================================================
   SAVE
========================================================= */

function save(){
  localStorage.setItem("liftrank_state",JSON.stringify(state));
}

/* =========================================================
   UTILITIES
========================================================= */

function escapeHTML(str){
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function showToast(message){
  const t=document.getElementById("toast");
  t.textContent=message;
  t.classList.add("show");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    t.classList.remove("show");
  },1800);
}

function setTab(tab){
  state.tab=tab;
  currentExercise=null;
  save();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

function xpLevel(){
  return Math.floor(state.xp/250)+1;
}

function xpProgress(){
  return ((state.xp%250)/250)*100;
}

function overallRank(){
  const level=xpLevel();

  if(level>=25)return ["Diamond","💎"];
  if(level>=20)return ["Platinum","🏆"];
  if(level>=15)return ["Gold","🥇"];
  if(level>=10)return ["Silver","🥈"];
  return ["Bronze","🥉"];
}

function muscleSets(name){
  return state.muscleSets[name] || 0;
}

function muscleRank(name){
  const sets=muscleSets(name);

  if(sets>=100)return ["S","100+"];
  if(sets>=75)return ["A","75+"];
  if(sets>=50)return ["B","50+"];
  if(sets>=25)return ["C","25+"];
  if(sets>=10)return ["D","10+"];
  return ["E","0–9"];
}

function totalCalories(){
  return state.food.reduce((a,b)=>a+Number(b.calories||0),0);
}

function totalProtein(){
  return state.food.reduce((a,b)=>a+Number(b.protein||0),0);
}

/* =========================================================
   WORKOUT ACTIONS
========================================================= */

function startEmptyWorkout(){
  state.workout=[];
  state.tab="workout";
  save();
  render();
}

function startRoutine(index){

  const routine=ROUTINES[index];

  state.workout=routine.exercises.map(name=>({
    name,
    sets:[
      {weight:"",reps:""},
      {weight:"",reps:""}
    ]
  }));

  state.tab="workout";
  save();
  render();
}

function addExerciseToWorkout(index){

  const ex=EXERCISES[index];

  if(!state.workout.some(x=>x.name===ex.name)){
    state.workout.push({
      name:ex.name,
      sets:[
        {weight:"",reps:""}
      ]
    });

    save();
    showToast("Added to workout");
  }else{
    showToast("Already in workout");
  }

  state.tab="workout";
  currentExercise=null;
  render();
}

function removeWorkoutExercise(index){
  state.workout.splice(index,1);
  save();
  render();
}

function addSet(index){

  state.workout[index].sets.push({
    weight:"",
    reps:""
  });

  save();
  render();
}

function removeSet(index,setIndex){

  if(state.workout[index].sets.length<=1){
    showToast("Keep at least one set");
    return;
  }

  state.workout[index].sets.splice(setIndex,1);
  save();
  render();
}

function updateSet(index,setIndex,key,value){

  state.workout[index].sets[setIndex][key]=value;
  save();
}

function finishWorkout(){

  let completed=0;
  let volume=0;

  state.workout.forEach(item=>{

    const ex=EXERCISES.find(e=>e.name===item.name);

    item.sets.forEach(set=>{

      const weight=Number(set.weight)||0;
      const reps=Number(set.reps)||0;

      if(reps>0){

        completed++;
        volume += weight*reps;

        state.history.push({
          exercise:item.name,
          weight,
          reps,
          date:new Date().toLocaleDateString()
        });

        if(ex){

          [...ex.primary,...ex.secondary].forEach(m=>{
            state.muscleSets[m]=(state.muscleSets[m]||0)+1;
          });

        }
      }
    });
  });

  if(completed===0){
    showToast("Log at least one set first");
    return;
  }

  state.completedSets+=completed;
  state.volume+=volume;
  state.xp+=completed*10;
  state.workouts++;

  state.workout=[];

  save();

  showToast("Workout complete! +" + (completed*10) + " XP");

  setTimeout(()=>{
    setTab("home");
  },600);
}

  }

  state.food.push({
    name,
    calories:Number(document.getElementById("foodCalories").value)||0,
    protein:Number(document.getElementById("foodProtein").value)||0
  });

  save();
  closeModal();
  render();
  showToast("Food logged");
}

function closeModal(){
  document.getElementById("modalBackdrop").classList.remove("show");
}

/* =========================================================
   RENDER
========================================================= */

function render(){

  let html="";

  if(currentExercise){

    html=renderExerciseDetail(currentExercise);

  }else{

    switch(state.tab){

      case "workout":
        html=renderWorkout();
        break;

      case "exercises":
        html=renderExercises();
        break;

      case "food":
        html=renderFood();
        break;

      case "ranks":
        html=renderRanks();
        break;

      default:
        html=renderHome();
    }

  }

  document.getElementById("app").innerHTML=`
    <main class="app">
      ${html}
    </main>
  `;

  document.querySelectorAll(".nav-btn").forEach(btn=>{
    btn.classList.toggle(
      "active",
      !currentExercise && btn.dataset.tab===state.tab
    );
  });
}

/* =========================================================
   OPEN EXERCISE
========================================================= */

function openExercise(index){

  currentExercise=EXERCISES[index];

  window.scrollTo({top:0,behavior:"smooth"});

  render();
}

/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll(".nav-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    setTab(btn.dataset.tab);

  });

});

document.getElementById("modalBackdrop").addEventListener("click",e=>{
  if(e.target.id==="modalBackdrop"){
    closeModal();
  }
});

/* =========================================================
   INITIALIZE
========================================================= */

render();

</script>

</body>
</html>
