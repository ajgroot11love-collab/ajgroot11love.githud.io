<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a10">
<title>LiftRank</title>

<style>
:root{
  --bg:#080910;
  --panel:#141621;
  --panel2:#1b1d2a;
  --panel3:#202332;
  --line:#303444;
  --text:#f7f7fb;
  --muted:#9da2b5;
  --purple:#805cff;
  --purple2:#a78bff;
  --blue:#4ca8ff;
  --blue2:#79c2ff;
  --green:#39d98a;
  --gold:#ffc247;
  --orange:#ff9f43;
  --red:#ff6677;
  --primary:#3478ff;
  --secondary:#7c91d8;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(circle at 50% -10%,#1c1730 0,#080910 45%);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    Arial,
    sans-serif;
}

body{
  padding-bottom:105px;
}

button,input,select{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:22px 16px 35px;
}

.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.logo{
  font-size:36px;
  font-weight:950;
  letter-spacing:-2px;
}

.logo span{
  color:var(--purple);
}

.subtitle{
  color:var(--muted);
  font-size:16px;
  margin-top:3px;
}

h1{
  font-size:39px;
  line-height:1.03;
  letter-spacing:-1.7px;
  margin:10px 0 7px;
}

h2{
  font-size:27px;
  letter-spacing:-.8px;
  margin:28px 0 15px;
}

h3{
  margin:0 0 7px;
}

.card{
  background:
    linear-gradient(145deg,#171925,#11131c);
  border:1px solid #303442;
  border-radius:25px;
  padding:19px;
  margin:12px 0;
  box-shadow:
    0 10px 30px rgba(0,0,0,.16);
}

.hero{
  padding:24px;
}

.rank-card{
  background:
    radial-gradient(circle at 90% 20%,#3b286b55,transparent 35%),
    linear-gradient(145deg,#1b1730,#14141f);
  border-color:#57458f;
}

.rank-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.rank-label{
  color:#a9a5bb;
  font-size:13px;
  letter-spacing:1px;
  font-weight:700;
}

.rank-name{
  font-size:34px;
  font-weight:950;
  margin:4px 0;
}

.rank-badge{
  width:76px;
  height:76px;
  border-radius:24px;
  background:linear-gradient(145deg,#8d68ff,#5f3ee7);
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:950;
  box-shadow:0 8px 25px #704cff55;
}

.progress{
  height:10px;
  background:#292d39;
  border-radius:999px;
  overflow:hidden;
  margin-top:18px;
}

.progress i{
  display:block;
  height:100%;
  background:linear-gradient(90deg,#6c45ff,#a181ff);
  border-radius:999px;
}

.progress-label{
  display:flex;
  justify-content:space-between;
  color:var(--muted);
  font-size:12px;
  margin-top:7px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.stat{
  min-height:135px;
}

.stat-label{
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.7px;
  font-size:13px;
}

.stat-number{
  font-size:35px;
  font-weight:950;
  margin-top:10px;
}

.orange{color:var(--orange)}
.green{color:var(--green)}
.blue{color:var(--blue)}
.purple{color:var(--purple)}
.gold{color:var(--gold)}

.btn{
  border-radius:16px;
  padding:13px 17px;
  background:linear-gradient(145deg,#8662ff,#7047ed);
  color:#fff;
  font-weight:850;
  transition:.15s;
}

.btn:active{
  transform:scale(.97);
}

.btn.secondary{
  background:#272b38;
}

.btn.green{
  background:var(--green);
  color:#07140e;
}

.btn.danger{
  background:#3a2029;
  color:#ff8998;
}

.btn.blue{
  background:linear-gradient(145deg,#51b3ff,#327fd0);
}

.btn.full{
  width:100%;
}

.btnrow{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.chips{
  display:flex;
  gap:9px;
  overflow-x:auto;
  scrollbar-width:none;
  margin-bottom:12px;
}

.chips::-webkit-scrollbar{
  display:none;
}

.chip{
  white-space:nowrap;
  padding:10px 15px;
  border-radius:999px;
  background:#222632;
  color:#adb2c2;
  font-weight:700;
}

.chip.active{
  background:#382a6c;
  color:#fff;
  outline:1px solid #7459d6;
}

.search{
  width:100%;
  border:1px solid var(--line);
  border-radius:17px;
  background:#11131c;
  color:#fff;
  padding:15px 16px;
  outline:none;
}

.search:focus{
  border-color:#7558d8;
}

.item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:15px;
  border:1px solid var(--line);
  border-radius:19px;
  background:#11131b;
  margin:9px 0;
}

.item-main{
  min-width:0;
}

.item-title{
  font-weight:850;
  font-size:16px;
}

.item-meta{
  color:var(--muted);
  font-size:13px;
  margin-top:4px;
}

.exercise-thumb{
  width:65px;
  height:65px;
  flex:0 0 65px;
  border-radius:17px;
  background:
    linear-gradient(145deg,#303446,#151722);
  display:grid;
  place-items:center;
  overflow:hidden;
}

.exercise-thumb svg{
  width:100%;
  height:100%;
}

.exercise-row{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.exercise-info{
  min-width:0;
}

.exercise-info .item-title{
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mini-rank{
  display:inline-flex;
  align-items:center;
  gap:4px;
  padding:4px 8px;
  border-radius:8px;
  background:#292333;
  color:#cfc6e9;
  font-size:10px;
  font-weight:800;
  margin-top:6px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:30px 15px;
}

/* MUSCLE MAP */

.muscle-card{
  overflow:hidden;
}

.muscle-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.legend{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:12px;
}

.legend-dot{
  width:10px;
  height:10px;
  display:inline-block;
  border-radius:3px;
  margin-right:4px;
}

.legend-primary{
  background:var(--primary);
}

.legend-secondary{
  background:var(--secondary);
}

.anatomy{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:14px;
}

.body-panel{
  background:
    radial-gradient(circle at 50% 45%,#26304d55,transparent 50%),
    #0f1119;
  border:1px solid #2d3242;
  border-radius:20px;
  padding:10px;
  min-height:385px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.body-label{
  color:#8f95a9;
  font-size:11px;
  letter-spacing:1px;
  font-weight:800;
  margin-bottom:5px;
}

.body-svg{
  width:100%;
  height:350px;
}

.muscle-none{
  fill:#dfe2eb;
  opacity:.92;
}

.muscle-primary{
  fill:#2e68ff;
  filter:drop-shadow(0 0 5px #2e68ff77);
}

.muscle-secondary{
  fill:#7187d0;
}

.body-outline{
  fill:none;
  stroke:#b8bfd0;
  stroke-width:1.2;
  opacity:.8;
}

.body-detail{
  fill:none;
  stroke:#9ea6b9;
  stroke-width:1;
  opacity:.55;
}

/* MUSCLE RANKS */

.muscle-rank-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.muscle-rank{
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  background:#11131b;
}

.muscle-rank-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.muscle-name{
  font-weight:850;
}

.tier{
  font-size:12px;
  font-weight:900;
  padding:5px 8px;
  border-radius:8px;
  background:#32294b;
  color:#d7caff;
}

.rank-xp{
  color:var(--muted);
  font-size:12px;
  margin-top:6px;
}

/* EXERCISE DETAIL */

.detail-image{
  width:100%;
  height:245px;
  border-radius:22px;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#38405a,transparent 58%),
    linear-gradient(145deg,#e8e8ec,#c7c8cf);
  border:1px solid #5c5f69;
  display:grid;
  place-items:center;
}

.detail-image svg{
  width:100%;
  height:100%;
}

.detail-title{
  font-size:31px;
  font-weight:950;
  margin:18px 0 4px;
  letter-spacing:-1px;
}

.detail-sub{
  color:var(--muted);
}

.muscle-pills{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:13px;
}

.muscle-pill{
  padding:7px 10px;
  border-radius:9px;
  font-size:11px;
  font-weight:800;
  background:#2e68ff;
  color:#fff;
}

.muscle-pill.secondary{
  background:#53679e;
}

.howto{
  display:block;
  text-align:center;
  text-decoration:none;
  color:#06111d;
  background:linear-gradient(145deg,#58baff,#318bd5);
  padding:16px;
  border-radius:17px;
  font-weight:950;
  margin-top:15px;
}

.detail-tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  background:#11131b;
  padding:5px;
  border-radius:15px;
  margin:15px 0;
}

.detail-tabs button{
  padding:11px 6px;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
  font-weight:800;
}

.detail-tabs button.active{
  background:#292331;
  color:#fff;
}

.detail-section{
  margin-top:16px;
}

/* WORKOUT */

.workout-card{
  background:#11131b;
  border:1px solid var(--line);
  border-radius:20px;
  padding:15px;
  margin:11px 0;
}

.workout-exercise-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:12px;
}

.set-header,
.set-row{
  display:grid;
  grid-template-columns:34px 1fr 1fr 45px 40px;
  gap:6px;
  align-items:center;
}

.set-header{
  color:#777d91;
  font-size:10px;
  font-weight:800;
  margin-bottom:5px;
}

.set-row{
  margin:7px 0;
}

.set-row input{
  width:100%;
  min-width:0;
  background:#1d202b;
  border:1px solid #343948;
  border-radius:10px;
  color:#fff;
  padding:10px 5px;
  text-align:center;
}

.set-number{
  color:#888ea0;
  text-align:center;
}

.set-button{
  height:40px;
  border-radius:10px;
  background:#282c38;
  color:#a9afc0;
  font-weight:900;
}

.set-button.done{
  background:var(--green);
  color:#06140d;
}

.timer-card{
  text-align:center;
  padding:18px;
}

.timer-label{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  font-weight:800;
}

.timer{
  font-size:48px;
  font-weight:950;
  font-variant-numeric:tabular-nums;
  margin:4px 0 12px;
}

/* FOOD */

.food-summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.recipe{
  border:1px solid var(--line);
  background:#11131b;
  border-radius:20px;
  padding:17px;
  margin:10px 0;
}

.recipe-title{
  font-size:20px;
  font-weight:900;
}

.recipe-meta{
  color:var(--muted);
  margin:6px 0 13px;
}

.recipe ul,
.recipe ol{
  color:#c9ceda;
  padding-left:20px;
}

.recipe li{
  margin:6px 0;
}

/* PROGRESS */

.chart{
  display:flex;
  align-items:flex-end;
  gap:8px;
  height:150px;
  margin-top:15px;
}

.chart-col{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:5px;
}

.chart-bar{
  width:100%;
  max-width:30px;
  border-radius:8px 8px 3px 3px;
  background:linear-gradient(180deg,#9a7aff,#6344e7);
  min-height:4px;
}

.chart-label{
  color:#858b9e;
  font-size:9px;
}

.stat-line{
  display:flex;
  justify-content:space-between;
  padding:11px 0;
  border-bottom:1px solid #292d38;
}

.stat-line:last-child{
  border-bottom:0;
}

.stat-line span:last-child{
  font-weight:850;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  background:#05060bee;
  overflow-y:auto;
  padding:15px;
}

.modal.hidden{
  display:none;
}

.modal-inner{
  width:100%;
  max-width:760px;
  margin:auto;
  padding-bottom:40px;
}

.modal-head{
  position:sticky;
  top:0;
  z-index:3;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 0 14px;
  background:#080910ed;
  backdrop-filter:blur(16px);
}

.close{
  width:43px;
  height:43px;
  border-radius:50%;
  background:#292d39;
  color:#fff;
  font-size:24px;
}

.toast{
  position:fixed;
  z-index:200;
  bottom:105px;
  left:50%;
  transform:translateX(-50%);
  background:#f5f6fa;
  color:#11131a;
  padding:12px 17px;
  border-radius:14px;
  font-weight:850;
  box-shadow:0 12px 35px #0008;
}

.form-label{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin:10px 0 5px;
}

.form-input{
  width:100%;
  background:#10121a;
  border:1px solid var(--line);
  color:#fff;
  padding:13px;
  border-radius:13px;
  outline:none;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

/* BOTTOM NAV */

.nav{
  position:fixed;
  z-index:80;
  bottom:11px;
  left:50%;
  transform:translateX(-50%);
  width:min(95%,850px);
  display:grid;
  grid-template-columns:repeat(5,1fr);
  padding:7px;
  border-radius:27px;
  background:#1b1e29ed;
  backdrop-filter:blur(22px);
  border:1px solid #373c4a;
  box-shadow:0 15px 45px #0009;
}

.nav button{
  background:transparent;
  color:#9a9fb0;
  border-radius:19px;
  padding:8px 3px;
  font-size:11px;
  font-weight:700;
}

.nav button.active{
  background:#252938;
  color:#fff;
}

.nav-icon{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}

.hidden{
  display:none!important;
}

@media(max-width:520px){

  .app{
    padding:18px 13px 35px;
  }

  h1{
    font-size:35px;
  }

  h2{
    font-size:25px;
  }

  .logo{
    font-size:34px;
  }

  .body-panel{
    min-height:340px;
  }

  .body-svg{
    height:310px;
  }

  .detail-image{
    height:210px;
  }

  .set-header,
  .set-row{
    grid-template-columns:28px 1fr 1fr 42px 38px;
  }

  .set-row input{
    padding:9px 3px;
  }

  .nav{
    bottom:8px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modal" class="modal hidden"></div>

<div id="toast" class="toast hidden"></div>

<nav class="nav">

  <button data-tab="home" onclick="showTab('home')">
    <span class="nav-icon">🏠</span>
    Home
  </button>

  <button data-tab="workout" onclick="showTab('workout')">
    <span class="nav-icon">🏋️</span>
    Workout
  </button>

  <button data-tab="exercises" onclick="showTab('exercises')">
    <span class="nav-icon">📚</span>
    Exercises
  </button>

  <button data-tab="food" onclick="showTab('food')">
    <span class="nav-icon">🍎</span>
    Food
  </button>

  <button data-tab="progress" onclick="showTab('progress')">
    <span class="nav-icon">🏆</span>
    Ranks
  </button>

</nav>

<script>

};

  return Date.now().toString(36)+Math.random().toString(36).slice(2,8);
};

const esc=(s)=>{
  return String(s).replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c])
  );
};

/* =========================================================
   RANK SYSTEM
========================================================= */

function rankFromXP(x){

  if(x>=5000)
    return{
      name:"Diamond",
      short:"D",
      min:5000,
      next:null
    };

  if(x>=2500)
    return{
      name:"Platinum",
      short:"P",
      min:2500,
      next:5000
    };

  if(x>=1200)
    return{
      name:"Gold",
      short:"G",
      min:1200,
      next:2500
    };

  if(x>=600)
    return{
      name:"Silver",
      short:"S",
      min:600,
      next:1200
    };

  if(x>=250)
    return{
      name:"Bronze+",
      short:"B+",
      min:250,
      next:600
    };

  return{
    name:"Bronze",
    short:"B",
    min:0,
    next:250
  };

}


function rankProgress(x){

  const r=rankFromXP(x);

  if(!r.next)
    return 100;

  return Math.min(
    100,
    Math.round(
      ((x-r.min)/
      (r.next-r.min))*100
    )
  );

}


/* =========================================================
   EXERCISE / MUSCLE XP
========================================================= */

function addExerciseXP(exercise,sets,volume){

  const gain=
    Math.max(
      5,
      sets*8+
      Math.round(volume/100)
    );

  exercise.xp=
    (exercise.xp||0)+gain;

  exercise.totalSets=
    (exercise.totalSets||0)+sets;

  exercise.totalVolume=
    (exercise.totalVolume||0)+volume;

  exercise.lastUsed=today();

  const best=Math.max(
    0,
    ...(
      activeWorkout?.exercises
        ?.find(x=>x.name===exercise.name)
        ?.sets||[]
    ).map(x=>+x.weight||0)
  );

  exercise.bestWeight=Math.max(
    exercise.bestWeight||0,
    best
  );

  return gain;

}


function addMuscleXP(muscle,sets){

  if(!db.muscleXP)
    db.muscleXP={};

  const gain=sets*12;

  db.muscleXP[muscle]=
    (db.muscleXP[muscle]||0)+gain;

}

function machineSVG(ex){

  const type=ex.type;

  if(type==="Cardio"){

    if(ex.name.includes("Row"))
      return rowingSVG();

    if(ex.name.includes("Bike"))
      return bikeSVG();

    if(ex.name.includes("Treadmill"))
      return treadmillSVG();

    if(ex.name.includes("Stair"))
      return stairSVG();

    return cardioSVG();

  }

  if(type==="Machine"||
     ex.equipment.includes("Machine")||
     ex.equipment.includes("Selectorized")||
     ex.equipment.includes("Plate")){

    return machineSVGGeneric(ex);

  }

  if(type==="Cable"||
     ex.equipment.includes("Cable")){

    return cableSVG(ex);

  }

  if(type==="Barbell"||
     ex.equipment.includes("Barbell")||
     ex.equipment.includes("Smith")){

    return barbellSVG(ex);

  }

  if(type==="Dumbbell"||
     ex.equipment.includes("Dumbbell")){

    return dumbbellSVG(ex);

  }

  if(type==="Bodyweight"||
     ex.equipment.includes("Bodyweight")){

    return bodyweightSVG(ex);

  }

  return genericExerciseSVG(ex);

}

  return list.map(ex=>{

    return `

      ex.equipment

function finishWorkout(){

  if(!activeWorkout)
    return;


  const completedSets=
    activeWorkout.exercises.reduce(
      (total,e)=>
        total+
        e.sets.filter(
          s=>s.done
        ).length,
      0
    );


  if(completedSets===0){

    toast(
      "Complete at least one set first"
    );

    return;

  }


  let workoutVolume=0;

  let workoutXP=0;

  const muscleSets={};


  activeWorkout.exercises
    .forEach(ex=>{

      const completed=
        ex.sets.filter(
          s=>s.done
        );

      const volume=
        completed.reduce(
          (a,s)=>
            a+
            (+s.weight||0)*
            (+s.reps||0),
          0
        );

      workoutVolume+=volume;


      const exercise=
        exerciseByName(ex.name);

      if(exercise){

        const gain=
          addExerciseXP(
            exercise,
            completed.length,
            volume
          );

        workoutXP+=gain;


        const muscle=
          exercise.muscle;

        muscleSets[muscle]=
          (muscleSets[muscle]||0)+
          completed.length;

      }

    });


  Object.entries(muscleSets)
    .forEach(
      ([muscle,sets])=>
        addMuscleXP(
          muscle,
          sets
        )
    );


  workoutXP=Math.max(
    25,
    workoutXP
  );


  db.xp+=workoutXP;


  db.workouts.push({

    id:uid(),

    date:today(),

    name:activeWorkout.name,

    duration:workoutSeconds,

    volume:workoutVolume,

    xp:workoutXP,

    exercises:
      JSON.parse(
        JSON.stringify(
          activeWorkout.exercises
        )
      )

  });


  save();

  clearInterval(workoutTimer);

  activeWorkout=null;

  closeModal();

  toast(
    `Workout saved • +${workoutXP} XP`
  );

  render();

}

    activeWorkout=null;

  }

}


function restTimer(){

  const t=
    document.getElementById("toast");

  t.classList.remove("hidden");

  const interval=
    setInterval(
      ()=>{

        t.textContent=
          `Rest: ${seconds}s`;

        seconds--;

        if(seconds<0){

          clearInterval(interval);

          t.textContent=
            "Rest complete ✓";

          setTimeout(
            ()=>{
              t.classList.add(
                "hidden"
              );
            },
            1200
          );

        }

      },
      1000
    );

}

          ></i>

        </div>

      </div>

      `;

    }).join("")}

  </div>


  <h2>
    Muscle Map
  </h2>


  <div class="card muscle-card">

    <div class="legend">

      <span>
        <i class="legend-dot legend-primary"></i>
        Primary
      </span>

      <span>
        <i class="legend-dot legend-secondary"></i>
        Secondary
      </span>

    </div>


    <div class="anatomy">

      <div class="body-panel">

        <div class="body-label">
          FRONT
        </div>

        ${bodyMap(
          Object.keys(week),
          [],
          false
        )}

      </div>


      <div class="body-panel">

        <div class="body-label">
          BACK
        </div>

        ${bodyMap(
          Object.keys(week),
          [],
          true
        )}

      </div>

    </div>

  </div>


  <h2>
    Muscle Activity
  </h2>


  <div class="card">

    ${
      MUSCLES.map(m=>{

        const value=
          week[m]||0;

        return `

        <div class="stat-line">

          <span>
            ${m}
          </span>

          <span>
            ${value} sets
          </span>

        </div>

        `;

      }).join("")
    }

  </div>


  <h2>
    Exercise & Machine Ranks
  </h2>


  <div>

    ${
      db.exercises
        .filter(x=>(x.xp||0)>0)
        .sort(
          (a,b)=>
            (b.xp||0)-
            (a.xp||0)
        )
        .slice(0,30)
        .map(ex=>{

          const r=
            exerciseRank(ex.name);

          return `

          <div class="item">

            <div class="exercise-row">

              <div class="exercise-thumb">
                ${machineSVG(ex)}
              </div>

              <div class="exercise-info">

                <div class="item-title">
                  ${esc(ex.name)}
                </div>

                <div class="item-meta">
                  ${ex.totalSets||0}
                  sets •
                  ${Math.round(
                    ex.totalVolume||0
                  ).toLocaleString()}
                  lb volume
                </div>

              </div>

            </div>

            <span class="tier">
              ${r.name}
            </span>

          </div>

          `;

        }).join("")
      ||
      `
      <div class="card empty">
        Start logging exercises to build
        individual exercise and machine ranks.
      </div>
      `
    }

  </div>

  `;

}


function volume(){

  return db.workouts.reduce(
    (total,w)=>
      total+
      (w.exercises||[]).reduce(
        (a,e)=>
          a+
          (e.sets||[]).reduce(
            (b,s)=>
              b+
              (+s.weight||0)*
              (+s.reps||0),
            0
          ),
        0
      ),
    0
  );

}


function musclesForRange(days){

  const cutoff=
    new Date();

  cutoff.setHours(
    0,0,0,0
  );

  cutoff.setDate(
    cutoff.getDate()-
    days+
    1
  );


  const counts={};


  db.workouts
    .filter(
      w=>
        new Date(w.date)>=cutoff
    )
    .forEach(
      w=>
        (w.exercises||[])
          .forEach(e=>{

            const ex=
              exerciseByName(
                e.name
              );

            if(!ex)
              return;

            const sets=
              (e.sets||[])
                .filter(
                  s=>s.done
                ).length;


            counts[ex.muscle]=
              (counts[ex.muscle]||0)+
              sets;

          })
    );


  return counts;

}


/* =========================================================
   NAV / RENDER
========================================================= */

function render(){

  document
    .querySelectorAll(".nav button")
    .forEach(
      b=>
        b.classList.toggle(
          "active",
          b.dataset.tab===activeTab
        )
    );


  let html="";


  if(activeTab==="home")
    html=homeHTML();

  if(activeTab==="workout")
    html=workoutHTML();

  if(activeTab==="exercises")
    html=exercisesHTML();

  if(activeTab==="food")
    html=foodHTML();

  if(activeTab==="progress")
    html=progressHTML();


  document.getElementById(
    "app"
  ).innerHTML=
    `<main class="app">${html}</main>`;

}


/* =========================================================
   MODALS
========================================================= */

function closeModal(){

  document
    .getElementById("modal")
    .classList.add("hidden");

  document
    .getElementById("modal")
    .innerHTML="";

}


/* =========================================================
   TIME
========================================================= */

function formatTime(seconds){

  const min=
    Math.floor(
      seconds/60
    );

  const sec=
    seconds%60;

  return(
    String(min).padStart(2,"0")
    +
    ":"
    +
    String(sec).padStart(2,"0")
  );

}


/* =========================================================
   START
========================================================= */

save();

render();

</script>
